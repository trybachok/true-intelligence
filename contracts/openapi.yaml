openapi: 3.1.0
info:
  title: Аналитический кабинет «Истинный интеллект»
  version: 1.0.0
  description: |
    Целевой контракт аналитического кабинета.

    Перед выполнением защищённой операции сервер проверяет подлинность учётных
    данных и определяет роль и компанию по данным пользователя на сервере.
    Клиентские параметры уточняют выборку в пределах разрешённой области.
    Отсутствующий, недействительный или просроченный токен даёт 401.
    После аутентификации запрет по роли даёт 403. Явно запрошенный существующий
    ресурс за пределами прав пользователя даёт 403, отсутствующий ресурс — 404.
    Сервер применяет область доступа к запросу данных до фильтрации и агрегации.

    Операции принимают только описанные параметры запроса. Неизвестные и повторные
    параметры строки запроса, пустые значения и неверные типы дают 400.
    Целые числа в строке запроса передаются десятичными цифрами без знака,
    пробелов, дробной части и экспоненты. JSON-тела проверяются без приведения
    типов и отклоняются при наличии неизвестных полей. HTTP-операции без
    requestBody не принимают тело запроса.
    Форматы email, date и date-time проверяются сервером как ограничения.
    Правила сравнения дат и принадлежности филиала проверяются отдельно от JSON Schema.
servers:
  - url: http://localhost:3020
    description: Локальное окружение Docker Compose
security:
  - bearerAuth: []
paths:
  /api:
    get:
      operationId: getHello
      security: []
      summary: Стартовый маршрут сервера
      responses:
        "200":
          description: Сервер отвечает
          content:
            text/html:
              schema:
                type: string
                const: Hello World!
        "400": { $ref: '#/components/responses/BadRequest' }
  /api/health:
    get:
      operationId: checkHealth
      security: []
      summary: Проверить подключение к PostgreSQL
      responses:
        "200":
          description: PostgreSQL выполнил проверочный запрос
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
        "400": { $ref: '#/components/responses/BadRequest' }
        "503":
          description: Проверочный запрос к PostgreSQL завершился ошибкой
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, error]
                properties:
                  statusCode:
                    const: 503
                  message:
                    const: PostgreSQL недоступен
                  error:
                    const: Service Unavailable
  /api/auth/login:
    post:
      operationId: login
      security: []
      summary: Войти в кабинет
      description: |
        Сервер приводит email к нижнему регистру и проверяет пароль без изменений.
        Ответ при неизвестном email и при неверном пароле одинаков. Роль и компания
        берутся из записи пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Вход выполнен
          headers:
            Cache-Control:
              required: true
              description: Запрещает кеширование ответа с токеном.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/InvalidCredentials' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/companies:
    get:
      operationId: listCompanies
      summary: Получить доступные компании
      description: |
        Администратор получает все компании, клиент получает свою компанию.
        Список отсортирован по возрастанию id. При отсутствии компаний возвращается пустой массив.
      responses:
        "200":
          description: Доступные компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/companies/{companyId}/branches:
    get:
      operationId: listCompanyBranches
      summary: Получить филиалы компании
      description: |
        Администратор может выбрать любую существующую компанию, клиент — свою.
        Список отсортирован по возрастанию id. Если у компании нет филиалов,
        возвращается пустой массив.
      parameters:
        - $ref: '#/components/parameters/CompanyPathId'
      responses:
        "200":
          description: Филиалы компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/analytics:
    get:
      operationId: getAnalytics
      summary: Получить сводку и динамику просмотров
      description: |
        Администратор получает данные всех компаний, клиент — своей компании.
        companyId и branchId сужают область. Если заданы оба параметра,
        указанный филиал должен принадлежать указанной компании. Несовпадение
        двух доступных идентификаторов даёт 400.
        Границы периода включаются. Для отзывов начальная граница — 00:00 UTC
        даты from, конечная — 00:00 UTC дня после to без включения.
        Просмотры, переходы, звонки и маршруты суммируются по ежедневным записям.
        Средняя оценка и количество отзывов считаются по опубликованным в периоде
        отзывам независимо от статуса. В сводке каждый отзыв имеет одинаковый вес.
        При отсутствии отзывов средняя оценка равна null, количество — 0.
        При отсутствии статистики счётчики равны 0. Динамика содержит
        точку за каждый день периода по возрастанию даты, с нулём при отсутствии записи.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        "200":
          description: Итоговые показатели и дневной ряд просмотров
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/companies/{companyId}/reviews:
    get:
      operationId: listCompanyReviews
      summary: Получить отзывы по филиалам компании
      description: |
        Администратор может выбрать любую существующую компанию, клиент — свою.
        Правила фильтрации, сортировки и постраничной выдачи описаны в ReviewPage.
      parameters:
        - $ref: '#/components/parameters/CompanyPathId'
        - $ref: '#/components/parameters/Rating'
        - $ref: '#/components/parameters/ReviewStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        "200": { $ref: '#/components/responses/ReviewsListed' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/branches/{branchId}/reviews:
    get:
      operationId: listBranchReviews
      summary: Получить отзывы филиала
      description: |
        Сервер определяет компанию по филиалу. Администратор видит отзывы любого
        существующего филиала, клиент — филиалов своей компании.
        Правила фильтрации, сортировки и постраничной выдачи описаны в ReviewPage.
      parameters:
        - $ref: '#/components/parameters/BranchPathId'
        - $ref: '#/components/parameters/Rating'
        - $ref: '#/components/parameters/ReviewStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BeforeId'
      responses:
        "200": { $ref: '#/components/responses/ReviewsListed' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/statistics/imports:
    post:
      operationId: importStatistics
      summary: Импортировать статистику филиала
      description: |
        Доступно только администратору. Сервер запрашивает статистику у имитации
        внешнего API по branchId и датам from и to включительно.
        До записи сервер проверяет принадлежность каждой строки филиалу и периоду,
        уникальность даты во входном наборе и допустимые значения счётчиков.
        Записи сохраняются одной транзакцией по ключу «филиал, дата».
        Повторный импорт тех же данных не создаёт дубликаты. Изменённые
        значения заменяют предыдущие. Отсутствие дня в ответе источника не удаляет
        ранее сохранённую статистику. Пустой ответ даёт 200 и нулевой счётчик.
        При ошибке источника или записи частичные изменения не сохраняются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        "200":
          description: Импорт завершён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "415": { $ref: '#/components/responses/UnsupportedMediaType' }
        "500": { $ref: '#/components/responses/InternalError' }
        "502": { $ref: '#/components/responses/UpstreamError' }
        "504": { $ref: '#/components/responses/UpstreamTimeout' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен, выданный при входе. Передаётся в заголовке Authorization как Bearer <token>.

  headers:
    Authenticate:
      required: true
      description: Запрос аутентификации для защищённого API.
      schema:
        type: string
      example: Bearer

  parameters:
    CompanyPathId:
      name: companyId
      in: path
      required: true
      description: Идентификатор компании.
      schema:
        $ref: '#/components/schemas/Id'
    BranchPathId:
      name: branchId
      in: path
      required: true
      description: Идентификатор филиала.
      schema:
        $ref: '#/components/schemas/Id'
    CompanyId:
      name: companyId
      in: query
      description: Идентификатор компании для ограничения выборки.
      schema:
        $ref: '#/components/schemas/Id'
    BranchId:
      name: branchId
      in: query
      description: Идентификатор филиала для ограничения выборки.
      schema:
        $ref: '#/components/schemas/Id'
    From:
      name: from
      in: query
      required: true
      description: Первый день периода включительно. Должен быть не позже to.
      schema:
        $ref: '#/components/schemas/ReportDate'
    To:
      name: to
      in: query
      required: true
      description: Последний день периода включительно. Должен быть не раньше from.
      schema:
        $ref: '#/components/schemas/ReportDate'
    Rating:
      name: rating
      in: query
      description: Точное значение оценки отзыва.
      schema:
        $ref: '#/components/schemas/Rating'
    ReviewStatus:
      name: status
      in: query
      description: Статус обработки отзыва.
      schema:
        $ref: '#/components/schemas/ReviewStatus'
    Limit:
      name: limit
      in: query
      description: Максимальное число отзывов в ответе.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    BeforeId:
      name: beforeId
      in: query
      description: Исключительная верхняя граница идентификатора для следующей страницы.
      schema:
        $ref: '#/components/schemas/Id'

  schemas:
    Id:
      description: Положительный целочисленный идентификатор записи PostgreSQL.
      type: integer
      minimum: 1
      maximum: 2147483647
    Count:
      description: Неотрицательный целочисленный счётчик в безопасном диапазоне JSON-клиента.
      type: integer
      minimum: 0
      maximum: 9007199254740991
    ReportDate:
      description: Календарная дата UTC в формате YYYY-MM-DD.
      type: string
      format: date
      pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    Email:
      description: Адрес электронной почты пользователя.
      type: string
      format: email
      minLength: 3
      maxLength: 254
    Rating:
      description: Целая оценка от 1 до 5.
      type: integer
      minimum: 1
      maximum: 5
    ReviewStatus:
      description: pending — ожидает обработки, processed — обработан.
      type: string
      enum: [pending, processed]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          description: Пароль учётной записи.
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          description: Токен для защищённых операций.
          type: string
          minLength: 1
        tokenType: { type: string, const: Bearer }
        expiresIn:
          description: Срок действия токена в секундах с момента выдачи.
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [id, email, role, companyId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { $ref: '#/components/schemas/Email' }
        role:
          description: admin — администратор, client — клиент.
          type: string
          enum: [admin, client]
        companyId:
          description: Компания клиента. Для администратора равно null.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
      if:
        properties:
          role: { const: admin }
      then:
        properties:
          companyId: { type: 'null' }
      else:
        properties:
          companyId: { $ref: '#/components/schemas/Id' }
    Company:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, description: Название компании. }
    Branch:
      type: object
      additionalProperties: false
      required: [id, companyId, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        companyId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, description: Название филиала. }
    Analytics:
      type: object
      additionalProperties: false
      required: [totals, dailyCardViews]
      properties:
        totals:
          $ref: '#/components/schemas/AnalyticsTotals'
        dailyCardViews:
          type: array
          description: Просмотры карточек по календарным дням UTC.
          items:
            $ref: '#/components/schemas/DailyCardViews'
    AnalyticsTotals:
      type: object
      additionalProperties: false
      required: [cardViews, websiteClicks, calls, routeRequests, averageRating, reviewCount]
      properties:
        cardViews:
          $ref: '#/components/schemas/Count'
          description: Просмотры карточек за период.
        websiteClicks:
          $ref: '#/components/schemas/Count'
          description: Переходы на сайт за период.
        calls:
          $ref: '#/components/schemas/Count'
          description: Звонки за период.
        routeRequests:
          $ref: '#/components/schemas/Count'
          description: Построенные маршруты за период.
        averageRating:
          description: Средняя оценка отзывов за период, округлённая до двух знаков.
          type: [number, 'null']
          minimum: 1
          maximum: 5
        reviewCount:
          $ref: '#/components/schemas/Count'
          description: Число отзывов за период.
    DailyCardViews:
      type: object
      additionalProperties: false
      required: [date, cardViews]
      properties:
        date: { $ref: '#/components/schemas/ReportDate' }
        cardViews: { $ref: '#/components/schemas/Count' }
    Review:
      type: object
      additionalProperties: false
      required: [id, branchId, publishedAt, rating, body, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        branchId: { $ref: '#/components/schemas/Id' }
        publishedAt: { type: string, format: date-time, description: Момент публикации в UTC. }
        rating: { $ref: '#/components/schemas/Rating' }
        body: { type: string, description: Текст отзыва. }
        status: { $ref: '#/components/schemas/ReviewStatus' }
    ReviewPage:
      description: |
        Фильтры rating и status применяются совместно. Отзывы упорядочены
        по убыванию id. Для следующей страницы передайте nextBeforeId как beforeId
        по тому же маршруту с теми же фильтрами. Если отзывов нет, items пуст и
        nextBeforeId равен null.
      type: object
      additionalProperties: false
      required: [items, nextBeforeId]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Review'
        nextBeforeId:
          description: Идентификатор последнего отзыва страницы или null, если продолжения нет.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
    ImportRequest:
      type: object
      additionalProperties: false
      required: [branchId, from, to]
      properties:
        branchId:
          $ref: '#/components/schemas/Id'
        from:
          $ref: '#/components/schemas/ReportDate'
          description: Первый день импорта включительно. Должен быть не позже to.
        to:
          $ref: '#/components/schemas/ReportDate'
          description: Последний день импорта включительно. Должен быть не раньше from.
    ImportResult:
      type: object
      additionalProperties: false
      required: [processedDays]
      properties:
        processedDays:
          $ref: '#/components/schemas/Count'
          description: Число дней, принятых от источника и обработанных при импорте.
    ApiError:
      type: object
      additionalProperties: false
      required: [statusCode, code, message]
      properties:
        statusCode:
          description: HTTP-статус ответа.
          type: integer
          minimum: 400
          maximum: 599
        code:
          description: Стабильный код ошибки для обработки клиентом.
          type: string
          enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR, UPSTREAM_ERROR, UPSTREAM_TIMEOUT]
        message:
          description: Сообщение для пользователя без внутренних деталей реализации.
          type: string
          minLength: 1
        details:
          description: Ошибки полей, когда причина относится к конкретным параметрам запроса.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string, minLength: 1, description: Имя параметра или путь к полю JSON. }
        message: { type: string, minLength: 1, description: Причина отклонения поля. }

  responses:
    ReviewsListed:
      description: Страница отзывов.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewPage'
    BadRequest:
      description: Запрос не прошёл валидацию.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  statusCode: { const: 400 }
                  code: { const: VALIDATION_ERROR }
          example: { statusCode: 400, code: VALIDATION_ERROR, message: Проверьте параметры запроса }
    InvalidCredentials:
      description: Адрес электронной почты или пароль неверны.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/Authenticate' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
                  statusCode: { const: 401 }
                  code: { const: INVALID_CREDENTIALS }
          example: { statusCode: 401, code: INVALID_CREDENTIALS, message: Неверный email или пароль }
    Unauthorized:
      description: Bearer-токен отсутствует, недействителен или просрочен.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/Authenticate' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiError'
              - properties:
